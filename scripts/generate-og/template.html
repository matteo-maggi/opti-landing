<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
  :root{--navy-900:#202a3c; --coral:#bb4828; --paper:#f5f4f0; --navy-300:#9aa5b3;}
  *{margin:0; padding:0; box-sizing:border-box;}
  body{width:1200px; height:630px; background:var(--navy-900); color:var(--paper);
       font-family:'Inter',sans-serif; overflow:hidden;}
  .card{height:100%; padding:72px 80px; display:flex; flex-direction:column; justify-content:space-between;
        background:radial-gradient(1100px 520px at 88% -15%, #2b3750, transparent);}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:20px; letter-spacing:0.08em;
           text-transform:uppercase; color:var(--coral);}
  h1{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:76px; line-height:1.05;
     letter-spacing:-0.02em; max-width:1000px;}
  h1 em{color:var(--coral); font-style:italic; font-weight:500;}
  .foot{display:flex; align-items:center; justify-content:space-between; font-size:24px; color:var(--navy-300);}
  .brand{display:flex; align-items:center; gap:16px; font-family:'Space Grotesk',sans-serif;
         font-weight:600; font-size:34px; color:#fff;}
  .brand img{height:48px;}
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Ci siamo incontrati in fiera</span>
    <h1>Ripartiamo dal tuo prossimo<br><em>sopralluogo.</em></h1>
    <div class="foot">
      <div class="brand"><img src="/assets/logo-white.svg" alt="">OPTI</div>
      <span>optiapp.it</span>
    </div>
  </div>
</body>
</html>
